# Performance-test overlay for the local Compose stack.
#
#   docker compose -f docker-compose.yml -f performance-tests/docker-compose.perf.yml up -d
#
# Differences from the development stack:
#   * APP_AUTH_MODE=api_key so the measured path is the production one. The
#     development default (disabled) skips authentication, the rate limiter and
#     the audit write, which together dominate authenticated latency.
#   * Quotas are raised well above the shipped defaults. The defaults
#     (principal_running=1) are a correctness control, not a throughput
#     setting, and would otherwise make every load test measure the quota
#     rather than the system.
#   * OTel is disabled so the collector is not part of the measurement.
#
# Every value below is the maximum Settings accepts; the bounds added in
# SEC-E2 are themselves a capacity ceiling and are analysed in the report.
#
# ARR_PERF_RATE_WINDOW=1 raises the effective ceiling from ~166 RPS to
# ~10k RPS. Needed once PERF-001 landed: the rate limiter, not the system,
# became the binding constraint and the sweep measured 429s instead of
# service time.
#
# Credentials come from performance-tests/.env.perf, which is gitignored and
# generated by scripts/setup-env.sh. Never commit it.
services:
  api:
    environment:
      APP_ENVIRONMENT: local
      APP_AUTH_MODE: api_key
      APP_ALLOW_PLAINTEXT_TRANSPORT: "true"
      APP_AUTH_PEPPER: ${APP_AUTH_PEPPER:?run performance-tests/scripts/setup-env.sh first}
      APP_AUTH_CREDENTIALS: ${APP_AUTH_CREDENTIALS:?run performance-tests/scripts/setup-env.sh first}
      APP_RATE_LIMIT_REQUESTS: ${ARR_PERF_RATE_LIMIT:-10000}
      APP_RATE_LIMIT_WINDOW_SECONDS: ${ARR_PERF_RATE_WINDOW:-60}
      APP_PRINCIPAL_CONCURRENT_RUNS: ${ARR_PERF_PRINCIPAL_ACTIVE:-1000}
      APP_TENANT_CONCURRENT_RUNS: ${ARR_PERF_TENANT_ACTIVE:-2000}
      APP_PRINCIPAL_RUNNING_RUNS: ${ARR_PERF_PRINCIPAL_RUNNING:-128}
      APP_TENANT_RUNNING_RUNS: ${ARR_PERF_TENANT_RUNNING:-256}
      APP_PRINCIPAL_PROVIDER_CALLS: ${ARR_PERF_PRINCIPAL_CALLS:-10000}
      APP_TENANT_PROVIDER_CALLS: ${ARR_PERF_TENANT_CALLS:-20000}
      APP_OTEL_ENABLED: "false"

  worker:
    environment:
      APP_ENVIRONMENT: local
      APP_AUTH_MODE: disabled
      APP_OTEL_ENABLED: "false"
      APP_WORKER_CONCURRENCY: ${ARR_PERF_WORKER_CONCURRENCY:-4}

  dispatcher:
    environment:
      APP_ENVIRONMENT: local
      APP_AUTH_MODE: disabled
      APP_OTEL_ENABLED: "false"

  scheduler:
    environment:
      APP_ENVIRONMENT: local
      APP_AUTH_MODE: disabled
      APP_OTEL_ENABLED: "false"
