name: agent-reliability-runtime

x-runtime: &runtime
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    APP_DATABASE_URL: postgresql+asyncpg://runtime:runtime@postgres:5432/agent_runtime
    APP_REDIS_URL: redis://redis:6379/0
    APP_RABBITMQ_URL: amqp://runtime:runtime@rabbitmq:5672/
    APP_OPENAI_BASE_URL: https://api.openai.com/v1
    APP_OPENAI_DEFAULT_MODEL: gpt-5
    APP_AUTH_MODE: disabled
    APP_ENVIRONMENT: local
    APP_WORKER_CONCURRENCY: 4
    APP_PROVIDER_TIMEOUT_SECONDS: 60
    APP_RETRY_MAX_ATTEMPTS: 3
    APP_RETRY_BASE_DELAY_SECONDS: 1
    APP_RETRY_MAX_BACKOFF_SECONDS: 60
    APP_RETRY_ATTEMPT_TIMEOUT_SECONDS: 60
    APP_RETRY_SCHEDULER_POLL_INTERVAL_SECONDS: 1
    APP_OUTBOX_BATCH_SIZE: 50
    APP_OUTBOX_POLL_INTERVAL_SECONDS: 1
    APP_OUTBOX_PUBLISH_TIMEOUT_SECONDS: 10
    APP_EXECUTION_LEASE_SECONDS: 120
    APP_LEASE_RECOVERY_POLL_INTERVAL_SECONDS: 5
    APP_OTEL_ENABLED: true
    APP_OTEL_ENDPOINT: http://otel-collector:4318
    APP_LOG_LEVEL: INFO
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-migration-dependency: &migration-dependency
  migrate:
    condition: service_completed_successfully

services:
  migrate:
    <<: *runtime
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *runtime
    command: ["agent-runtime-api"]
    depends_on: *migration-dependency
    ports:
      - "8000:8000"

  worker:
    <<: *runtime
    command: ["agent-runtime-worker"]
    depends_on: *migration-dependency

  dispatcher:
    <<: *runtime
    command: ["agent-runtime-dispatcher"]
    depends_on: *migration-dependency

  scheduler:
    <<: *runtime
    command: ["agent-runtime-recovery"]
    depends_on: *migration-dependency

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d agent_runtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: runtime
      RABBITMQ_DEFAULT_PASS: runtime
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/security-alerts.yml:/etc/prometheus/security-alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
