apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-reliability-runtime.fullname" . }}-config
  labels:
    {{- include "agent-reliability-runtime.labels" . | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  APP_AUTH_MODE: {{ .Values.config.authMode | quote }}
  APP_OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  APP_OPENAI_DEFAULT_MODEL: {{ .Values.config.openaiDefaultModel | quote }}
  APP_WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  APP_PROVIDER_TIMEOUT_SECONDS: {{ .Values.config.providerTimeoutSeconds | quote }}
  APP_MAX_REQUEST_BYTES: {{ .Values.config.maxRequestBytes | quote }}
  APP_REQUEST_BODY_TIMEOUT_SECONDS: {{ .Values.config.requestBodyTimeoutSeconds | quote }}
  APP_REGRESSION_MAX_CASES: {{ .Values.config.regressionMaxCases | quote }}
  APP_REGRESSION_PROVIDER_CALL_BUDGET: {{ .Values.config.regressionProviderCallBudget | quote }}
  APP_PROVIDER_MAX_OUTPUT_TOKENS: {{ .Values.config.providerMaxOutputTokens | quote }}
  APP_PRINCIPAL_CONCURRENT_RUNS: {{ .Values.config.principalConcurrentRuns | quote }}
  APP_TENANT_CONCURRENT_RUNS: {{ .Values.config.tenantConcurrentRuns | quote }}
  APP_PRINCIPAL_RUNNING_RUNS: {{ .Values.config.principalRunningRuns | quote }}
  APP_TENANT_RUNNING_RUNS: {{ .Values.config.tenantRunningRuns | quote }}
  APP_PRINCIPAL_PROVIDER_CALLS: {{ .Values.config.principalProviderCalls | quote }}
  APP_TENANT_PROVIDER_CALLS: {{ .Values.config.tenantProviderCalls | quote }}
  APP_QUOTA_WINDOW_SECONDS: {{ .Values.config.quotaWindowSeconds | quote }}
  APP_AUDIT_FAILURE_POLICY: {{ .Values.config.auditFailurePolicy | quote }}
  APP_AUDIT_WRITE_TIMEOUT_SECONDS: {{ .Values.config.auditWriteTimeoutSeconds | quote }}
  APP_TRUST_INBOUND_TRACE_CONTEXT: {{ .Values.config.trustInboundTraceContext | quote }}
  APP_DETERMINISTIC_ECHO_INPUT: {{ .Values.config.deterministicEchoInput | quote }}
  APP_PAYLOAD_RETENTION_DAYS: {{ .Values.config.payloadRetentionDays | quote }}
  APP_RETRY_MAX_ATTEMPTS: {{ .Values.config.retryMaxAttempts | quote }}
  APP_RETRY_BASE_DELAY_SECONDS: {{ .Values.config.retryBaseDelaySeconds | quote }}
  APP_RETRY_MAX_BACKOFF_SECONDS: {{ .Values.config.retryMaxBackoffSeconds | quote }}
  APP_RETRY_ATTEMPT_TIMEOUT_SECONDS: {{ .Values.config.retryAttemptTimeoutSeconds | quote }}
  APP_RETRY_SCHEDULER_POLL_INTERVAL_SECONDS: {{ .Values.config.retrySchedulerPollIntervalSeconds | quote }}
  APP_OUTBOX_BATCH_SIZE: {{ .Values.config.outboxBatchSize | quote }}
  APP_OUTBOX_POLL_INTERVAL_SECONDS: {{ .Values.config.outboxPollIntervalSeconds | quote }}
  APP_OUTBOX_PUBLISH_TIMEOUT_SECONDS: {{ .Values.config.outboxPublishTimeoutSeconds | quote }}
  APP_EXECUTION_LEASE_SECONDS: {{ .Values.config.executionLeaseSeconds | quote }}
  APP_LEASE_RECOVERY_POLL_INTERVAL_SECONDS: {{ .Values.config.leaseRecoveryPollIntervalSeconds | quote }}
  APP_OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  APP_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  APP_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
