apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-reliability-runtime.fullname" . }}-migrate
  labels:
    {{- include "agent-reliability-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "agent-reliability-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "agent-reliability-runtime.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            # SEC-018: when existingSecret.migration is set it carries
            # APP_MIGRATION_DATABASE_URL, the DDL-capable role that the
            # long-running workloads never receive.
            - secretRef:
                name: {{ include "agent-reliability-runtime.migrationSecretName" . }}
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir: {}
