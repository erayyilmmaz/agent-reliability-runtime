image:
  repository: agent-reliability-runtime
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# This chart never creates credential values. Create these Secrets outside Helm
# (for example through External Secrets or kubectl) before installation.
#
# SEC-012: credentials are split by role so a single compromised pod does not
# expose every credential the system holds.
#   common    - APP_DATABASE_URL, APP_REDIS_URL, APP_RABBITMQ_URL,
#               APP_AUTH_CREDENTIALS, APP_AUTH_PEPPER, APP_PAYLOAD_KEK
#   provider  - APP_OPENAI_API_KEY. Mounted into the worker ONLY.
#   migration - APP_MIGRATION_DATABASE_URL (DDL role, SEC-018). Mounted into the
#               migration Job only. Falls back to `common` when empty.
existingSecret:
  common: agent-reliability-runtime-secrets
  provider: agent-reliability-runtime-provider
  migration: ""

# SEC-011: applied to every pod this chart renders. runAsUser matches the UID
# pinned in docker/Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# SEC-OPS-01: background workloads have no HTTP surface, so their probes read a
# heartbeat that is only written after real progress.
heartbeat:
  path: /tmp/arr/heartbeat.json
  maxAgeSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  environment: production
  authMode: api_key
  openaiBaseUrl: https://api.openai.com/v1
  openaiDefaultModel: gpt-5
  workerConcurrency: 4
  providerTimeoutSeconds: 60
  maxRequestBytes: 131072
  requestBodyTimeoutSeconds: 10
  regressionMaxCases: 10
  regressionProviderCallBudget: 20
  providerMaxOutputTokens: 2048
  principalConcurrentRuns: 20
  tenantConcurrentRuns: 40
  principalRunningRuns: 1
  tenantRunningRuns: 2
  principalProviderCalls: 120
  tenantProviderCalls: 240
  quotaWindowSeconds: 3600
  auditFailurePolicy: fail_closed
  auditWriteTimeoutSeconds: 2
  trustInboundTraceContext: false
  deterministicEchoInput: false
  payloadRetentionDays: 30
  retryMaxAttempts: 3
  retryBaseDelaySeconds: 1
  retryMaxBackoffSeconds: 60
  retryAttemptTimeoutSeconds: 60
  retrySchedulerPollIntervalSeconds: 1
  outboxBatchSize: 50
  outboxPollIntervalSeconds: 1
  outboxPublishTimeoutSeconds: 10
  executionLeaseSeconds: 120
  leaseRecoveryPollIntervalSeconds: 5
  otelEnabled: false
  otelEndpoint: http://otel-collector:4318
  # SEC-TRAN-01: staging/production reject redis:// and amqp:// unless this
  # is deliberately turned on (for example an in-cluster kind demo).
  allowPlaintextTransport: false
  heartbeatIntervalSeconds: 10
  logLevel: INFO

api:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

dispatcher:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

scheduler:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
