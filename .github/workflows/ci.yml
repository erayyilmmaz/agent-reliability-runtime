name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: arr_security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runtime -d arr_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARR_TEST_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/arr_security_test
      ARR_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=agent_runtime --cov-report=term-missing --cov-fail-under=60

  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: bash scripts/compose-smoke.sh
      - name: Test security alert thresholds
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/docker:/rules:ro" -w /rules
          prom/prometheus:v3.0.1 test rules security-alerts.test.yml

  helm-lint:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.4
      - run: helm lint charts/agent-reliability-runtime
      - run: helm template arr charts/agent-reliability-runtime --namespace arr

  terraform-validate:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [sandbox, staging, production]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} validate
