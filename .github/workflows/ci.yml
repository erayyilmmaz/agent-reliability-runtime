name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=agent_runtime --cov-report=term-missing --cov-fail-under=60

  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: bash scripts/compose-smoke.sh

  helm-lint:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.4
      - run: helm lint charts/agent-reliability-runtime
      - run: helm template arr charts/agent-reliability-runtime --namespace arr

  terraform-validate:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [sandbox, staging, production]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} validate
