name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: arr_security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runtime -d arr_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARR_TEST_DATABASE_URL: postgresql+asyncpg://runtime:runtime@localhost:5432/arr_security_test
      ARR_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=agent_runtime --cov-report=term-missing --cov-fail-under=60

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Dependency vulnerabilities (SCA). Audits the resolved environment
      # rather than a requirements file: pip-audit's --requirement mode builds
      # a throwaway venv via ensurepip, which is brittle across runners.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Audit locked dependencies
        run: |
          uv sync --locked --dev
          uvx --from pip-audit pip-audit \
            --path "$(.venv/bin/python -c 'import site; print(site.getsitepackages()[0])')" \
            --skip-editable --progress-spinner off

      # Secret scanning across the full history
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required for pull_request events since gitleaks-action v2.3.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # Static analysis (SAST)
      - name: Run Semgrep
        run: |
          uvx semgrep scan --config p/python --config p/security-audit \
            --config p/secrets --config p/dockerfile --config p/terraform \
            --metrics=off --error --quiet

      # Container image vulnerabilities
      - name: Build image for scanning
        run: docker build -f docker/Dockerfile -t arr-scan:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arr-scan:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # SEC-016: SBOM as a build artifact
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: arr-scan:ci
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json

  compose-smoke:
    needs: quality
    runs-on: ubuntu-latest
    env:
      # SEC-021B: Grafana refuses to start without an admin password. This is a
      # throwaway value for a stack that is torn down at the end of the job; it
      # is never published and grants nothing outside this runner.
      GRAFANA_ADMIN_PASSWORD: ci-ephemeral-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose config --quiet
      - run: bash scripts/compose-smoke.sh
      - name: Test security alert thresholds
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/docker:/rules:ro" -w /rules
          prom/prometheus:v3.0.1 test rules security-alerts.test.yml

  helm-lint:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.4
      - run: helm lint charts/agent-reliability-runtime
      - run: helm template arr charts/agent-reliability-runtime --namespace arr
      # SEC-011 / SEC-012 / SEC-OPS-01 regression gate
      - run: bash scripts/helm-security-check.sh

  terraform-validate:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [sandbox, staging, production]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/environments/${{ matrix.environment }} validate
