# SEC-SC-01: publish a container image whose origin can be verified.
#
# Runs only on a version tag, never on a branch push or a pull request, so
# nothing here executes on untrusted input. Publishing produces three artifacts
# a consumer can check independently:
#   1. the image, addressed by digest
#   2. a SLSA build-provenance attestation signed via GitHub's OIDC identity
#   3. a CycloneDX SBOM attached as an attestation
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and sign
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # OIDC identity for keyless signing
      attestations: write   # provenance + SBOM attestations
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildkit's own provenance/SBOM, in addition to the attestations below
          provenance: mode=max
          sbom: true

      # SLSA build provenance, signed with the workflow's OIDC identity.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Report how to verify this release
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Published

          \`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`

          Verify provenance before deploying:

          \`\`\`bash
          gh attestation verify \\
            oci://ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} \\
            --repo ${{ github.repository }}
          \`\`\`

          Deploy by digest, never by tag:

          \`\`\`bash
          helm upgrade --install arr charts/agent-reliability-runtime \\
            --set image.repository=ghcr.io/${{ github.repository }} \\
            --set image.digest=${{ steps.build.outputs.digest }}
          \`\`\`
          EOF
