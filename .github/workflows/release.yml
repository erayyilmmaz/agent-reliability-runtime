# SEC-SC-01: publish a container image whose origin can be verified.
#
# Runs only on a version tag, never on a branch push or a pull request, so
# nothing here executes on untrusted input. Publishing produces three artifacts
# a consumer can check independently:
#   1. the image, addressed by digest
#   2. a SLSA build-provenance attestation signed via GitHub's OIDC identity
#   3. a CycloneDX SBOM attached as an attestation
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and sign
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # OIDC identity for keyless signing
      attestations: write   # provenance + SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Required for the attestations below. The runner's default buildx driver
      # is `docker`, which rejects `--attest` outright ("Attestation is not
      # supported for the docker driver"); this sets up a docker-container
      # builder, which supports it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildkit's own provenance/SBOM, in addition to the attestations below
          provenance: mode=max
          sbom: true

      # SLSA build provenance, signed with the workflow's OIDC identity.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Report how to verify this release
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Published

          \`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`

          Verify provenance before deploying:

          \`\`\`bash
          gh attestation verify \\
            oci://ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} \\
            --repo ${{ github.repository }}
          \`\`\`

          Deploy by digest, never by tag:

          \`\`\`bash
          helm upgrade --install arr charts/agent-reliability-runtime \\
            --set image.repository=ghcr.io/${{ github.repository }} \\
            --set image.digest=${{ steps.build.outputs.digest }}
          \`\`\`
          EOF
