{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "arr-security",
      "folder": "ARR Security",
      "interval": "1m",
      "rules": [
        {
          "uid": "arr-sec-0",
          "title": "ARRAuditWriteFailure",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "model": {
                "expr": "sum(increase(arr_security_events_total{category=\"audit_write\",outcome=\"error\"}[5m]))",
                "instant": true,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "0s",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Security audit persistence failed"
          },
          "isPaused": false
        },
        {
          "uid": "arr-sec-1",
          "title": "ARRAuthenticationDeniedSpike",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "model": {
                "expr": "sum(rate(arr_security_events_total{category=\"auth\",outcome=\"denied\"}[5m]))",
                "instant": true,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        5
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "2m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Authentication rejection rate is elevated"
          },
          "isPaused": false
        },
        {
          "uid": "arr-sec-2",
          "title": "ARRRateLimitSpike",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "model": {
                "expr": "sum(rate(arr_security_events_total{category=\"rate_limit\",outcome=\"denied\"}[5m]))",
                "instant": true,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0.1
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "2m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Request rate limits are repeatedly exhausted"
          },
          "isPaused": false
        },
        {
          "uid": "arr-sec-3",
          "title": "ARRQuotaExhaustion",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "model": {
                "expr": "sum(increase(arr_security_events_total{category=\"quota\",outcome=\"denied\"}[5m]))",
                "instant": true,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "1m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Tenant or principal resource quota is exhausted"
          },
          "isPaused": false
        },
        {
          "uid": "arr-sec-4",
          "title": "ARRRetryStorm",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "model": {
                "expr": "sum(rate(arr_retries_scheduled_total[5m]))",
                "instant": true,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        1
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "2m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Retry scheduling rate is elevated"
          },
          "isPaused": false
        },
        {
          "uid": "arr-sec-5",
          "title": "ARRProviderCallSpike",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "model": {
                "expr": "sum(rate(arr_provider_calls_total[5m]))",
                "instant": true,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "type": "threshold",
                "expression": "A",
                "refId": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        10
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "2m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Provider invocation rate is elevated"
          },
          "isPaused": false
        }
      ]
    }
  ]
}
